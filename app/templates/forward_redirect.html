<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <form id="forwardForm" method="POST" action="{{ url_for('emails.compose') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if to %}<input type="hidden" name="to" value="{{ to }}">{% endif %}
        <input type="hidden" name="subject" value="{{ subject }}">
        <input type="hidden" name="body" value="{{ body }}">
        {% if forward_email_id %}<input type="hidden" name="forward_email_id" value="{{ forward_email_id }}">{% endif %}
        {% if in_reply_to %}<input type="hidden" name="in_reply_to" value="{{ in_reply_to }}">{% endif %}
        {% if references %}<input type="hidden" name="references" value="{{ references }}">{% endif %}
        {% if body_is_html %}<input type="hidden" name="body_is_html" value="1">{% endif %}
        <input type="hidden" name="from_forward" value="1">
    </form>
    <script>
        document.getElementById('forwardForm').submit();
    </script>
    <p>Redirecting to compose...</p>
</body>
</html>
