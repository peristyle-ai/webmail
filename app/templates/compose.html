{% extends "base.html" %}

{% block title %}Compose - PyPG Mail{% endblock %}

{% block content %}
<div class="p-3 sm:p-6 pb-20 md:pb-6 max-w-2xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-lg sm:text-2xl font-bold text-gray-800">New Message</h1>
        <a href="{{ url_for('emails.inbox') }}" class="text-gray-600 hover:text-gray-800 text-sm">
            <i class="fas fa-times mr-1"></i>Discard
        </a>
    </div>

    <!-- Compose Form -->
    <form method="post" action="{{ url_for('emails.compose') }}" class="space-y-4">
        <div>
            <label for="to" class="block text-sm font-medium text-gray-700 mb-1">To</label>
            <input type="email" id="to" name="to" required autocomplete="email"
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base"
                   value="{{ to }}" placeholder="recipient@example.com">
        </div>

        <div>
            <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
            <input type="text" id="subject" name="subject" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base"
                   value="{{ subject }}" placeholder="Subject">
        </div>

        <div>
            <label for="body" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
            <textarea id="body" name="body" rows="12"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base"
                      placeholder="Write your message here...">{{ body }}</textarea>
        </div>

        <div class="flex items-center justify-between pt-2">
            <div class="text-xs text-gray-500 hidden sm:block">
                <i class="fas fa-info-circle mr-1"></i>
                Emails will be delivered within 30-60 seconds
            </div>
            <button type="submit"
                    class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold text-base">
                <i class="fas fa-paper-plane mr-2"></i>Send
            </button>
        </div>
    </form>
</div>
{% endblock %}
