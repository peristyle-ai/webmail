name: tests

# The repository was replaced on 2026-11-02, so that the personal addresses
# in its history would leave the public record. The history is rewritten; the
# tree, the tests and this gate are unchanged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    # GitHub's own secret scanning and push protection are free on a PUBLIC
    # repository. On a private repository they need GitHub Advanced Security,
    # which is a paid add-on -- so until this repo is public, this script is
    # the enforcement.
    #
    # It scans BOTH:
    #
    #   1. the working tree -- every file tracked at HEAD;
    #   2. every blob in every commit -- so a secret that was committed and
    #      then deleted is still found. (GitHub's secret scanning does the
    #      same thing, and it is the reason a "fix the leak and move on"
    #      commit is not enough.)
    #
    # A scanner that scanned 0 objects must report INCONCLUSIVE, never
    # CLEAN, and must exit non-zero. Silence is not a pass.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not a shallow clone: a secret that was
          # committed and then deleted is still in the history, and
          # deleting the file does not un-leak it.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: no secret was committed
        run: python scripts/check_no_secrets.py

  compile:
    # This repository's tests are CONNECTIVITY tests against a running mail
    # server (they call its /health), so they cannot run in CI without one.
    # What CI can check is that the code still compiles and imports.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: every module compiles
        run: python -m compileall -q app config.py run.py
